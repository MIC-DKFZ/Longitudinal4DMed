# ISLES 2024 -- stroke CTP follow-up, ~92 training cases, continuous time
# Usage: python src/train.py --config configs/isles.yaml
# Data env var: DATA_DIR  (must contain trn_m_isles.npy and tst_m_isles.npy)
# See src/data_loaders/isles_loader.py generate_save_data() for preprocessing.

dataset: isles
model_type: cronos

# data
batch_size: 2
num_workers: 4
num_to_keep_context: 3
context_target_distance: 3
num_frames: 7
val_split: 0

# model
base_channels: 16
fm_model_unet_expands: [1, 1, 2]
number_evals: 10
training_noise: 0.01

# optimization
lr: 1e-4
weight_decay: 0.01
num_epochs: 500
log_interval: 10

# misc
seed: 42
device: cuda
save_dir: checkpoints/isles
